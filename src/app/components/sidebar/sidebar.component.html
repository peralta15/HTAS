<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <h1 class="logo">HTAS</h1>
  </div>
  
  <nav class="sidebar-nav">
    <!-- Dashboard con paciente por defecto -->
    <a 
      class="nav-item" 
      [routerLink]="['/dashboard', '1']" 
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: true}">
      <span class="nav-icon">📊</span>
      <span class="nav-text" *ngIf="!collapsed">Dashboard</span>
    </a>
    
    <!-- Usuarios -->
    <a 
      class="nav-item" 
      [routerLink]="['/usuarios']" 
      routerLinkActive="active">
      <span class="nav-icon">👥</span>
      <span class="nav-text" *ngIf="!collapsed">Usuarios</span>
    </a>
    
    <!-- Reportes -->
    <a 
      class="nav-item" 
      [routerLink]="['/reportes']" 
      routerLinkActive="active">
      <span class="nav-icon">📈</span>
      <span class="nav-text" *ngIf="!collapsed">Reportes</span>
    </a>
    
    <!-- Configuración -->
    <a 
      class="nav-item" 
      [routerLink]="['/configuracion']" 
      routerLinkActive="active">
      <span class="nav-icon">⚙️</span>
      <span class="nav-text" *ngIf="!collapsed">Configuración</span>
    </a>
  </nav>
</aside>
