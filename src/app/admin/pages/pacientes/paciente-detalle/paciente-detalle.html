<app-menu #sidebar></app-menu>

<main class="main-content" [class.menu-collapsed]="sidebar.isCollapsed">
    @if (usuarioSeleccionado) {
    <div class="container-fluid">
        <div class="header-section">
            <div class="title-group">
                <h2 class="title-page">Editar Paciente</h2>
                <p class="subtitle-page">Actualiza la información y el expediente del paciente.</p>
            </div>

            <div class="header-controls">
                <button class="btn-cancel" (click)="volver()">
                    <i class="bi bi-arrow-left"></i>
                    <span>Volver a la lista</span>
                </button>
            </div>
        </div>

        <div class="detail-card">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre(s)</label>
                    <input type="text" required maxlength="40" [(ngModel)]="usuarioSeleccionado.nombre" class="form-control-premium">
                </div>
                <div class="form-group">
                    <label>Apellido Paterno</label>
                    <input type="text" required maxlength="30" [(ngModel)]="usuarioSeleccionado.tempApellidoPaterno" class="form-control-premium">
                </div>
                <div class="form-group">
                    <label>Apellido Materno</label>
                    <input type="text" required maxlength="30" [(ngModel)]="usuarioSeleccionado.tempApellidoMaterno" class="form-control-premium">
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" maxlength="60" [(ngModel)]="usuarioSeleccionado.correo" class="form-control-premium">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" maxlength="10" [(ngModel)]="usuarioSeleccionado.telefono" class="form-control-premium">
                </div>
                <div class="form-group">
                    <label>NSS (Seguro Social)</label>
                    <input type="text" maxlength="11" placeholder="Ingrese 11 dígitos"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')" [(ngModel)]="usuarioSeleccionado.nss" class="form-control-premium">
                </div>
            </div>

            <div class="action-footer">
                <button class="btn-save" (click)="guardarCambios()" [disabled]="isSaving">
                    @if (isSaving) {
                    <span class="spinner-save"></span>
                    <span>Guardando...</span>
                    } @else {
                    <i class="bi bi-check-lg"></i>
                    <span>Guardar Cambios</span>
                    }
                </button>
            </div>
        </div>
    </div>
    }
</main>
