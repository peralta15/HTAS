<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1 class="logo">HTAS</h1>
      <h2>Panel administrativo</h2>
      <p>Inicia sesión para acceder al dashboard.</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          autocomplete="email"
        />
        <div class="field-error" *ngIf="loginForm.submitted && loginForm.controls['email']?.errors">
          <span *ngIf="loginForm.controls['email']?.errors?.['required']">El email es obligatorio.</span>
          <span *ngIf="loginForm.controls['email']?.errors?.['email']">El email no tiene un formato válido.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          autocomplete="current-password"
        />
        <div class="field-error" *ngIf="loginForm.submitted && loginForm.controls['password']?.errors">
          <span *ngIf="loginForm.controls['password']?.errors?.['required']">La contraseña es obligatoria.</span>
          <span *ngIf="loginForm.controls['password']?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</span>
        </div>
      </div>

      <div class="error" *ngIf="error">
        {{ error }}
      </div>

      <button class="btn-login" type="submit" [disabled]="loading || loginForm.invalid">
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading">Validando…</span>
      </button>

      <button
        class="btn-google"
        type="button"
        (click)="loginWithGoogle()"
        [disabled]="loading"
      >
        Iniciar con Google
      </button>
    </form>
  </div>
</div>
